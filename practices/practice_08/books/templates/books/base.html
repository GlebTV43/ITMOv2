{% load static %}<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Дай почитать{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'books/site.css' %}">
</head>
<body>
<header><nav aria-label="Главное меню" class="shell">
  <a class="brand" href="{% url 'catalog' %}">Дай почитать</a>
  <a href="{% url 'catalog' %}">Каталог</a>
  {% if user.is_authenticated %}
    <a href="{% url 'add_book' %}">Выставить книгу</a>
    <a href="{% url 'exchanges' %}">Обмены</a>
    <a href="{% url 'profile' user.pk %}">Мой профиль</a>
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="secondary">Выйти</button></form>
  {% else %}
    <a href="{% url 'login' %}">Войти</a>
    <a href="{% url 'register' %}">Регистрация</a>
  {% endif %}
</nav></header>
<main class="shell">
  {% for message in messages %}<p class="notice" role="status">{{ message }}</p>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
